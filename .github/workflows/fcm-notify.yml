# Atsar Qurani — kirim notifikasi FCM (GRATIS, repo publik = menit unlimited).
# Cron per jam + loop internal 5-menitan: tidak bergantung pada ketepatan
# cron 5-menitan GitHub. Secret repo yang wajib ada: GCLOUD_SERVICE_KEY.
name: fcm-notify

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: # tombol jalan manual dari tab Actions

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: fcm-sender/package.json
      - run: npm install
        working-directory: fcm-sender
      - run: node loop.js
        working-directory: fcm-sender
        env:
          GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
